<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <title>Redefinir senha</title>
    <style type="text/css">
      :root { color-scheme: light only; }
      @media (prefers-color-scheme: dark) {
        .email-bg { background-color: #f7f3ee !important; }
        .email-card { background-color: #fffaf7 !important; }
        .email-ink { color: #2a3330 !important; }
        .email-muted { color: #5c6762 !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#f7f3ee;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#2a3330;">
    <table role="presentation" class="email-bg" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f3ee;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" class="email-card" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#fffaf7;border-radius:24px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 20px 28px;text-align:center;background-color:#f0c9c4;">
                <img
                  src="https://cuidadoempar.vercel.app/brand/logo-horizontal.png"
                  width="200"
                  height="51"
                  alt="Cuidado em Par"
                  style="display:block;margin:0 auto;width:200px;max-width:80%;height:auto;border:0;"
                />
              </td>
            </tr>
            <tr>
              <td style="padding:28px;text-align:center;">
                <h1 class="email-ink" style="margin:0 0 12px 0;font-size:24px;line-height:1.3;color:#2a3330;">
                  Redefinir sua senha
                </h1>
                <p class="email-muted" style="margin:0 0 24px 0;font-size:16px;line-height:1.55;color:#5c6762;">
                  Recebemos um pedido para criar uma senha nova. Se foi voce, toque no botao abaixo.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;border-radius:999px;background-color:#4a7c6e;color:#fffaf7;font-size:16px;font-weight:700;text-decoration:none;">
                  Criar senha nova
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px 28px;">
                <p class="email-muted" style="margin:0;padding:16px;border-radius:16px;background-color:#f3ebe4;font-size:13px;line-height:1.5;color:#5c6762;">
                  Nao pediu redefinicao? Ignore este e-mail. Sua senha atual continua valendo.
                </p>
              </td>
            </tr>
          </table>
          <p class="email-muted" style="margin:16px 0 0 0;font-size:11px;line-height:1.4;color:#5c6762;max-width:520px;">
            Botao nao funciona? Copie e cole no navegador:<br />
            <span style="word-break:break-all;">{{ .ConfirmationURL }}</span>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
