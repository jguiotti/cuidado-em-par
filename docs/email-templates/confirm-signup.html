<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu e-mail</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f7f3ee;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#2a3330;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f3ee;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#fffaf7;border-radius:24px;">
            <tr>
              <td style="padding:28px;text-align:center;background-color:#b8d9c8;">
                <p style="margin:0;font-size:14px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#4a7c6e;">
                  Cuidado em Par
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;text-align:center;">
                <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.3;color:#2a3330;">
                  Confirme seu e-mail
                </h1>
                <p style="margin:0 0 24px 0;font-size:16px;line-height:1.55;color:#5c6762;">
                  Toque no botao abaixo para ativar o seu espaco seguro de saude e movimento.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;border-radius:999px;background-color:#4a7c6e;color:#fffaf7;font-size:16px;font-weight:700;text-decoration:none;">
                  Confirmar e entrar
                </a>
                <p style="margin:24px 0 0 0;font-size:12px;line-height:1.5;color:#5c6762;word-break:break-all;">
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px 28px;">
                <p style="margin:0;padding:16px;border-radius:16px;background-color:#f3ebe4;font-size:13px;line-height:1.5;color:#5c6762;">
                  Se voce nao pediu esta conta, ignore este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
